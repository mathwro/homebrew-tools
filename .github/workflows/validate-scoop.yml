name: Validate Scoop

on:
  pull_request:
    paths:
      - "bucket/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "bucket/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Scoop repository policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate definitions and generated metadata
        run: |
          python scripts/package_repository.py validate-definitions
          python scripts/validate_metadata.py repository
          python -m unittest discover -s tests -v

  changes:
    name: Select Scoop install tests
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select affected package targets
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          matrix="$(python scripts/changed_packages.py scoop --base "$BASE_SHA")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          count="$(MATRIX="$matrix" python -c 'import json,os; print(len(json.loads(os.environ["MATRIX"])["include"]))')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
        shell: bash

  install:
    name: Scoop install (${{ matrix.package }}, ${{ matrix.target }})
    needs: [policy, changes]
    if: needs.changes.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate manifest URLs and hashes
        shell: pwsh
        run: python scripts/validate_metadata.py scoop $env:PACKAGE --online
      - name: Install, verify, and uninstall through Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:SCOOP = Join-Path $env:USERPROFILE "scoop"
          $scoopRoot = Join-Path $env:SCOOP "apps/scoop/current"
          New-Item -ItemType Directory -Force -Path $scoopRoot | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:SCOOP "shims") | Out-Null
          git -C $scoopRoot init
          git -C $scoopRoot remote add origin https://github.com/ScoopInstaller/Scoop.git
          git -C $scoopRoot fetch --depth 1 origin b588a06e41d920d2123ec70aee682bae14935939
          git -C $scoopRoot checkout --detach FETCH_HEAD
          $scoop = Join-Path $scoopRoot "bin/scoop.ps1"
          $definition = Get-Content "packages/$env:PACKAGE.yml" -Raw | ConvertFrom-Json
          $manifest = Get-Content "bucket/$env:PACKAGE.json" -Raw | ConvertFrom-Json
          $bucketRoot = Join-Path $env:SCOOP "buckets/homebrew-tools-test"
          New-Item -ItemType Directory -Force -Path (Split-Path $bucketRoot) | Out-Null
          git clone --quiet $env:GITHUB_WORKSPACE $bucketRoot
          if ($LASTEXITCODE -ne 0) {
            throw "failed to clone test bucket"
          }
          $installed = $false
          try {
            & $scoop install "homebrew-tools-test/$env:PACKAGE"
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop install failed for $env:PACKAGE"
            }
            $installed = $true
            $executable = (& $scoop which $definition.executable | Select-Object -First 1)
            if ([string]::IsNullOrWhiteSpace($executable)) {
              throw "Scoop did not expose $($definition.executable)"
            }
            python scripts/smoke_version.py $env:PACKAGE $manifest.version $executable
            if ($LASTEXITCODE -ne 0) {
              throw "version smoke test failed for $env:PACKAGE"
            }
          }
          finally {
            if ($installed) {
              & $scoop uninstall $env:PACKAGE
              if ($LASTEXITCODE -ne 0) {
                throw "Scoop uninstall failed for $env:PACKAGE"
              }
            }
            Remove-Item $bucketRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
