name: Update package

on:
  repository_dispatch:
    types: [cli-release]
  workflow_dispatch:
    inputs:
      repository:
        description: Allowlisted OWNER/REPOSITORY
        required: true
        type: string
      package:
        description: Allowlisted package name
        required: true
        type: string
      tag:
        description: Exact stable release tag
        required: true
        type: string
      version:
        description: Stable SemVer matching the tag
        required: true
        type: string
      release_id:
        description: Optional immutable GitHub release ID
        required: false
        type: string

permissions:
  contents: read

jobs:
  normalize:
    name: Normalize release event
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.event.outputs.repository }}
      package: ${{ steps.event.outputs.package }}
      tag: ${{ steps.event.outputs.tag }}
      version: ${{ steps.event.outputs.version }}
      release_id: ${{ steps.event.outputs.release_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Normalize and allowlist event
        id: event
        env:
          REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
          PACKAGE: ${{ github.event.client_payload.package || inputs.package }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          RELEASE_ID: ${{ github.event.client_payload.release_id || inputs.release_id }}
        run: |
          python scripts/package_repository.py normalize-event \
            --repository "$REPOSITORY" \
            --package "$PACKAGE" \
            --tag "$TAG" \
            --version "$VERSION" \
            --release-id "$RELEASE_ID" \
            --github-output "$GITHUB_OUTPUT"

  update:
    needs: normalize
    uses: ./.github/workflows/run-update.yml
    with:
      repository: ${{ needs.normalize.outputs.repository }}
      package: ${{ needs.normalize.outputs.package }}
      tag: ${{ needs.normalize.outputs.tag }}
      version: ${{ needs.normalize.outputs.version }}
      release_id: ${{ needs.normalize.outputs.release_id }}
    permissions:
      contents: write
      pull-requests: write
