name: Update package

on:
  repository_dispatch:
    types: [cli-release]
  workflow_dispatch:
    inputs:
      repository:
        description: Allowlisted OWNER/REPOSITORY
        required: true
        type: string
      package:
        description: Allowlisted package name
        required: true
        type: string
      tag:
        description: Exact stable release tag
        required: true
        type: string
      version:
        description: Stable SemVer without v
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    uses: ./.github/workflows/run-update.yml
    with:
      repository: ${{ github.event.client_payload.repository || inputs.repository }}
      package: ${{ github.event.client_payload.package || inputs.package }}
      tag: ${{ github.event.client_payload.tag || inputs.tag }}
      version: ${{ github.event.client_payload.version || inputs.version }}
    permissions:
      contents: write
      pull-requests: write
